# Local development — Phase 0 (Postgres + optional API)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factfulness
      POSTGRES_PASSWORD: factfulness
      POSTGRES_DB: factfulness
    ports:
      - "5432:5432"
    volumes:
      - factfulness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factfulness -d factfulness"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://factfulness:factfulness@postgres:5432/factfulness
      AUTH_MODE: dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - api

volumes:
  factfulness_pg:

# Local development — Postgres, MinIO (S3), ClamAV, optional API
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factfulness
      POSTGRES_PASSWORD: factfulness
      POSTGRES_DB: factfulness
    ports:
      - "5432:5432"
    volumes:
      - factfulness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factfulness -d factfulness"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - factfulness_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2024-09-22T00-33-43Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/factfulness-quarantine &&
      mc mb --ignore-existing local/factfulness-evidence &&
      exit 0
      "

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://factfulness:factfulness@postgres:5432/factfulness
      AUTH_MODE: dev
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_QUARANTINE_BUCKET: factfulness-quarantine
      S3_CLEAN_BUCKET: factfulness-evidence
      SCANNER_BACKEND: clamd
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    profiles:
      - api

volumes:
  factfulness_pg:
  factfulness_minio:
